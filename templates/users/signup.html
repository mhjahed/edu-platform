{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h2><i class="fas fa-user-plus"></i> Sign Up</h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="{{ form.username.id_for_label }}"><i class="fas fa-user"></i> Username</label>
                            {{ form.username }}
                        </div>
                        <div class="form-group">
                            <label for="{{ form.first_name.id_for_label }}"><i class="fas fa-signature"></i> First Name</label>
                            {{ form.first_name }}
                        </div>
                        <div class="form-group">
                            <label for="{{ form.last_name.id_for_label }}"><i class="fas fa-signature"></i> Last Name</label>
                            {{ form.last_name }}
                        </div>
                        <div class="form-group">
                            <label for="{{ form.email.id_for_label }}"><i class="fas fa-envelope"></i> Email</label>
                            {{ form.email }}
                        </div>
                        <div class="form-group">
                            <label for="{{ form.password1.id_for_label }}"><i class="fas fa-lock"></i> Password</label>
                            {{ form.password1 }}
                        </div>
                        <div class="form-group">
                            <label for="{{ form.password2.id_for_label }}"><i class="fas fa-lock"></i> Confirm Password</label>
                            {{ form.password2 }}
                        </div>
                        <div class="form-group">
                            <label for="{{ form.role.id_for_label }}"><i class="fas fa-user-tag"></i> Role</label>
                            {{ form.role }}
                        </div>
                        <button type="submit" class="btn btn-success btn-block"><i class="fas fa-check"></i> Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
